name: Nightly stats pull
on:
  schedule:
    - cron: "0 9 * * *"    # 5am ET (9:00 UTC), daily: everything
    - cron: "20 * * * *"   # hourly: Colts game-day file before a Colts kickoff; scores and box scores once games have kicked off
  workflow_dispatch:
    inputs:
      boxtest_week:
        description: "Test only: write box scores for this week number to data/_boxtest.json"
        required: false
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full pull
        if: github.event.schedule != '20 * * * *'
        run: python scripts/pull.py
      - name: Colts game-day refresh
        if: github.event.schedule == '20 * * * *'
        run: |
          python scripts/colts.py --hourly || true
          python scripts/games.py --hourly
      - name: Box score test
        if: github.event.inputs.boxtest_week != ''
        run: python scripts/games.py --week ${{ github.event.inputs.boxtest_week }}
      - name: Commit data
        run: |
          git config user.name "our-guys-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
