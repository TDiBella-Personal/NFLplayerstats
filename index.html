<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#11151B">
<title>Our Guys</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%88%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --base:#11151B; --panel:#1A2029; --panel2:#212936; --line:#2B3440;
  --text:#F3F5F8; --muted:#9BA6B5; --field:#16231C; --fieldline:#2A3B31;
  --off:#E9EDF2; --def:#F2B84B;
  --display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",Impact,sans-serif;
  --body:"Instrument Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--base);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac,#fff);outline-offset:2px;border-radius:6px}
.wrap{max-width:520px;margin:0 auto}
img{max-width:100%}

#home{padding:20px 16px 120px}
.top h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;margin:0;letter-spacing:.01em}
.top p{margin:6px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.grid button{background:var(--panel);border-radius:12px;padding:11px 12px;text-align:left;border-left:3px solid var(--cc);min-height:58px}
.grid b{font-weight:600;font-size:15.5px;display:block}
.grid small{color:var(--muted);font-size:12.5px;display:block;line-height:1.25}
#side{display:none}
.listhead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.listhead h2{font-size:15px;font-weight:600;margin:0}
.listhead span{font-size:13px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:62px 1fr auto;align-items:stretch;width:100%;text-align:left;background:var(--panel);border-radius:12px;overflow:hidden;min-height:68px}
.row .slab{background:var(--c1);color:var(--c2);font-family:var(--display);font-weight:800;font-size:32px;display:flex;align-items:center;justify-content:center;position:relative}
.row .slab::after{content:"";position:absolute;right:-9px;top:0;bottom:0;width:18px;background:var(--c1);transform:skewX(-9deg)}
.row .who{padding:11px 8px 11px 20px;min-width:0}
.row .nm{font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:2px}
.row .meta b{color:var(--ac);font-weight:600}
.row .meta img{width:18px;height:18px;object-fit:contain}
.row .hl{padding:0 14px 0 6px;text-align:right;display:flex;flex-direction:column;justify-content:center}
.row .hl strong{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.row .hl small{font-size:11.5px;color:var(--muted)}
.star-mini{color:var(--ac);font-size:12px}
.empty{background:var(--panel);border-radius:12px;padding:18px;color:var(--muted);font-size:15px;list-style:none}
.empty strong{color:var(--text);display:block;margin-bottom:2px}

/* reference rows */
.ref{display:block;width:100%;text-align:left;background:var(--panel);border-radius:12px;padding:12px 14px 13px;border-left:3px solid var(--cc)}
.ref .rt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ref .rn{font-weight:600;font-size:16px}
.ref .rs{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:14px;margin-top:3px;line-height:1.4}
.tag{font-size:11.5px;font-weight:600;color:var(--cc);white-space:nowrap}
.grp{font-size:13px;color:var(--muted);font-weight:600;margin:20px 0 8px;display:flex;justify-content:space-between}
.grp:first-child{margin-top:0}
.morebtn{width:100%;padding:11px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:14px;list-style:none}
.askrow{width:100%;margin-top:18px;padding:14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-align:left;display:flex;gap:12px;align-items:center}
.askrow b{display:block;font-weight:600}
.askrow small{color:var(--muted);font-size:13px}
.askrow.big{background:#233042;border-color:#3A5170}

.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--base) 70%,rgba(17,21,27,0));padding:22px 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:6}
.dock .dk{max-width:520px;margin:0 auto;display:flex;gap:8px}
#homebtn{flex:none;width:54px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.dock .in{flex:1;min-width:0;display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:0 6px 0 14px}
.dock svg{flex:none;color:var(--muted)}
.dock input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:17px;padding:15px 10px;outline:none}
.dock input::placeholder{color:var(--muted)}
.dock .in:focus-within{border-color:#5d6b7e}
.dock input::-webkit-search-cancel-button,.pickin input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.dock .clear{width:40px;height:40px;color:var(--muted);font-size:20px;display:none}
.dock .clear.on{display:block}

#card{position:fixed;inset:0;background:var(--base);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);visibility:hidden;transition:transform .2s ease-out,visibility 0s .2s;padding-bottom:calc(118px + env(safe-area-inset-bottom,0px));z-index:5}
#card.open{transform:none;visibility:visible;transition:transform .2s ease-out}
.hdr{background:var(--c1);position:relative;overflow:hidden;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 20px}
.hdr::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.42))}
.hdr .big{position:absolute;right:-6px;bottom:-38px;font-family:var(--display);font-weight:800;font-size:210px;line-height:1;color:var(--c2);opacity:.26;letter-spacing:-.02em;pointer-events:none}
.hdr .logo{position:absolute;right:14px;top:calc(56px + env(safe-area-inset-top,0px));width:64px;height:64px;object-fit:contain;opacity:.95}
.hdr>*:not(.big):not(.logo){position:relative}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar .r{display:flex;gap:8px}
.bar button{height:40px;padding:0 14px;border-radius:20px;background:rgba(0,0,0,.34);font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:7px;white-space:nowrap}
.bar .fav[aria-pressed="true"]{background:#fff;color:#11151B}
.id{display:flex;gap:14px;align-items:flex-end;margin-top:26px;padding-right:70px}
.face{width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:30px;flex:none;overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover;object-position:top}
.id h2{font-family:var(--display);font-weight:800;font-size:40px;line-height:.95;margin:0;text-wrap:balance}
.id .sub{margin-top:7px;font-size:14.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.03em;background:var(--c1);color:#fff;border:1.5px solid var(--c2);border-radius:6px;padding:1px 6px;line-height:1.35}
.hdr .badge{background:rgba(0,0,0,.35)}

.sec{padding:22px 16px 0}
.sec h3{font-size:15px;font-weight:600;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 span{font-weight:400;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;margin:0}
.stats div{border-left:2px solid var(--ac);padding-left:10px}
.stats dd{margin:0;font-family:var(--display);font-weight:800;font-size:36px;line-height:1}
.stats dt{font-size:12.5px;color:var(--muted);margin-top:3px}
.nostat{color:var(--muted);font-size:15px;margin:0}
.more{margin-top:18px;width:100%;height:46px;border-radius:12px;border:1px solid var(--line);font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.more i{display:inline-block;transition:transform .15s;font-style:normal;color:var(--ac)}
.more[aria-expanded="true"] i{transform:rotate(180deg)}
.drawer{display:none;margin-top:16px;background:var(--panel);border-radius:12px;padding:16px 14px}
.drawer.on{display:block}
.drawer .thru{font-size:12.5px;color:var(--muted);margin:14px 0 0}
.drawer .stats dd{font-size:30px}

.last{background:var(--panel);border-radius:12px;padding:14px}
.last .g{font-size:14.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.last .g img{width:22px;height:22px;object-fit:contain}
.last .g b{font-weight:600}
.last .line{display:flex;flex-wrap:wrap;gap:6px 18px}
.last .line span{font-size:13px;color:var(--muted)}
.last .line strong{font-family:var(--display);font-weight:800;font-size:24px;color:var(--text);margin-right:4px}

.bio{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:15px}
.bio dt{color:var(--muted)}
.bio dd{margin:0}
.path{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.path li{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:10px;padding:7px 11px 7px 7px;font-size:14px}
.path li img{width:24px;height:24px;object-fit:contain}
.path li small{color:var(--muted);font-size:12.5px}
.path li.now{outline:1.5px solid var(--ac)}

.story ul,.deep ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.story li,.deep li{padding-left:16px;position:relative;font-size:15.5px;line-height:1.5}
.story li::before,.deep li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;background:var(--ac);transform:skewX(-12deg)}
.btn{margin-top:16px;width:100%;height:50px;border-radius:12px;font-weight:600;font-size:15.5px;background:var(--ac);color:#0d1117;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text);font-weight:500}
.working{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:15px;background:var(--panel);border-radius:12px;padding:16px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ac);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.thin{color:var(--muted);font-size:15px;background:var(--panel);border-radius:12px;padding:16px;margin:0}

/* plain sheet header (rulebook, ask, compare, picker) */
.phdr{padding:calc(10px + env(safe-area-inset-top,0px)) 16px 18px;background:linear-gradient(180deg,#1B2330,var(--base))}
.phdr .bar button{background:var(--panel2)}
.phdr h2{font-family:var(--display);font-weight:800;font-size:40px;line-height:.98;margin:22px 0 0;text-wrap:balance}
.phdr .kick{margin-top:18px;display:flex;gap:10px;align-items:center;font-size:13.5px}
.phdr .kick .tag{font-size:13px}
.chg{font-size:12.5px;color:#0d1117;background:var(--def);border-radius:6px;padding:1px 7px;font-weight:600}

/* reference entry */
.lead{font-size:19px;line-height:1.45;margin:0;padding:4px 16px 0;text-wrap:pretty}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:12px;overflow:hidden;margin:0}
.facts div{background:var(--panel);padding:12px 14px}
.facts div.w{grid-column:1/-1}
.facts dt{font-size:12.5px;color:var(--muted)}
.facts dd{margin:3px 0 0;font-weight:600;font-size:16px}
.facts div.w dd{font-weight:400;font-size:15px;line-height:1.45}
.onTV{background:var(--panel);border-radius:12px;padding:13px 14px;font-size:15px;line-height:1.5;margin:0}
.onTV b{color:var(--ac);font-weight:600}
.dia{background:var(--field);border-radius:12px;overflow:hidden}
.dia svg{display:block;width:100%;height:auto}
.dia p{margin:0;padding:0 14px 12px;color:#B7C4BB;font-size:13.5px}
.deep{display:none;margin-top:14px}
.deep.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px 13px;font-size:14px}

/* browse */
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);border-radius:18px;padding:8px 14px;font-size:14.5px;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--cc);border-color:var(--cc);color:#0d1117;font-weight:600}
.cats small{opacity:.7;margin-left:4px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

/* ask */
.askbox{display:flex;gap:8px;margin:0 16px}
.askbox input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:17px;padding:13px 14px;outline:none}
.askbox input:focus{border-color:#5d6b7e}
.askbox button{background:var(--ac);color:#0d1117;border-radius:12px;font-weight:600;padding:0 18px}
.note{color:var(--muted);font-size:13px;margin:10px 0 0}

/* compare */
.cmph{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.cmph .side{background:var(--c1);border-radius:12px;padding:12px;position:relative;overflow:hidden;min-height:128px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end}
.cmph .side::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
.cmph .side>*{position:relative}
.cmph .side .num{position:absolute;right:-2px;top:-14px;font-family:var(--display);font-weight:800;font-size:92px;color:var(--c2);opacity:.28;line-height:1}
.cmph .face{width:48px;height:48px;font-size:18px;margin-bottom:8px}
.cmph .nm{font-family:var(--display);font-weight:800;font-size:23px;line-height:1;text-wrap:balance}
.cmph .ps{font-size:13px;margin-top:4px;opacity:.9}
.cmph .chg2{position:absolute;top:8px;left:8px;font-size:12px;background:rgba(0,0,0,.4);border-radius:12px;padding:3px 9px}
.cmpt{width:100%;border-collapse:collapse;margin:0}
.cmpt td{padding:11px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.cmpt td.l{text-align:center;color:var(--muted);font-size:13px;width:36%}
.cmpt td.a,.cmpt td.b{font-family:var(--display);font-weight:800;font-size:25px;line-height:1;width:32%;color:#6E7887}
.cmpt td.b{text-align:right}
.cmpt td.win{color:var(--wc)}
.cmpt td.tie{color:var(--text)}
.cmpt td.txt{font-family:var(--body);font-weight:500;font-size:14px;color:var(--text);line-height:1.3}
.lg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lg2 div{background:var(--panel);border-radius:12px;padding:12px;font-size:14px;line-height:1.45}
.swap{display:flex;gap:8px;padding:12px 16px 0}
.swap button{flex:1;height:42px;border-radius:12px;border:1px solid var(--line);font-size:14.5px}
.pickin{display:flex;align-items:center;margin:0 16px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.pickin input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:17px;padding:13px 8px;outline:none}

.stats.two{grid-template-columns:1fr 1fr}
.stats.two dd{font-size:32px}
.drawer .stats.two dd{font-size:28px}
.retbtn{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:14.5px;font-weight:500}
.bestbox{background:var(--panel);border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center}
.bestbox b{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--ac)}
.bestbox span{font-size:15.5px;line-height:1.35}
.quote{background:var(--panel);border-radius:12px;padding:14px;border-left:3px solid var(--ac)}
.quote q{display:block;font-size:18px;line-height:1.35;font-weight:500;quotes:"\201C" "\201D"}
.quote p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.quote a,.term a{font-size:12.5px;color:var(--muted)}
.term{background:var(--panel);border-radius:12px;padding:12px 14px}
.term b{display:block;font-weight:600;font-size:16px}
.term span{display:block;color:var(--muted);font-size:14.5px;margin-top:2px;line-height:1.45}
.seg{display:flex;gap:6px;padding:12px 16px 0}
.seg button{flex:1;height:38px;border-radius:10px;border:1px solid var(--line);font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--text);color:#11151B;border-color:var(--text);font-weight:600}
.rulecite{color:var(--muted);font-size:13.5px}
@media (min-width:900px){
  body{padding-left:248px}
  #side{display:flex;flex-direction:column;gap:2px;position:fixed;left:0;top:0;bottom:0;width:248px;background:#0D1116;border-right:1px solid var(--line);padding:18px 10px;overflow-y:auto;z-index:7}
  #side h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;margin:2px 10px 16px}
  #side button{text-align:left;padding:10px 12px;border-radius:10px;font-size:15px;display:flex;gap:11px;align-items:center}
  #side button i{width:9px;height:9px;border-radius:2px;background:var(--cc);flex:none;transform:skewX(-10deg)}
  #side button[aria-current="true"]{background:var(--panel2);font-weight:600}
  #side hr{border:0;border-top:1px solid var(--line);margin:8px 6px;width:auto}
  .grid{display:none}
  #card,.dock{left:248px}
  #homebtn{display:none}
  .top h1{font-size:36px}
  .toast{left:calc(50% + 124px)}
}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:#fff;color:#11151B;font-size:14.5px;font-weight:500;padding:10px 16px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:88vw;text-align:center;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#card,.toast,.more i{transition:none}.spin{animation-duration:2.4s}}
</style>
</head>
<body>
<nav id="side" aria-label="Sections"></nav>
<main id="home" class="wrap">
  <div class="top">
    <h1>Our Guys</h1>
    <p id="upd">Loading</p>
  </div>
  <div class="grid" id="grid"></div>
  <div class="listhead"><h2 id="lh">Favorites</h2><span id="lc"></span></div>
  <div id="results"><ul class="rows" id="rows"><li class="empty">Loading players</li></ul></div>
</main>

<div class="dock"><div class="dk">
  <button id="homebtn" aria-label="Home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
  <label class="in">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>

  for(var yl=Math.ceil(y0/5)*5;yl<=y1;yl+=5){if(yl!==0)s+='<line x1="0" x2="'+W+'" y1="'+fy(yl)+'" y2="'+fy(yl)+'" stroke="#2A3B31" stroke-width="1"/>'}
  for(var yh=Math.ceil(y0);yh<=y1;yh++){[44,56].forEach(function(h){s+='<line x1="'+fx(h)+'" x2="'+fx(h)+'" y1="'+(fy(yh)-2)+'" y2="'+(fy(yh)+2)+'" stroke="#2A3B31" stroke-width="1"/>'})}
  s+='<line x1="0" x2="'+W+'" y1="'+fy(0)+'" y2="'+fy(0)+'" stroke="#5B7FA8" stroke-width="1.5" stroke-dasharray="4 3"/>';
  (d.zones||[]).forEach(function(z){var l=fx(z.cx-z.rx),r=fx(z.cx+z.rx),col=z.s==="o"?"#E9EDF2":"#F2B84B";
    s+='<ellipse cx="'+((l+r)/2)+'" cy="'+fy(z.cy)+'" rx="'+((r-l)/2)+'" ry="'+(z.ry*Y)+'" fill="'+col+'" fill-opacity=".13" stroke="'+col+'" stroke-opacity=".5" stroke-dasharray="3 3"/>';
    if(z.label)s+='<text x="'+((l+r)/2)+'" y="'+(fy(z.cy)+4)+'" text-anchor="middle" font-size="11" fill="'+col+'" fill-opacity=".9">'+esc(z.label)+'</text>'});
  (d.paths||[]).forEach(function(p){var col=p.s==="d"?"#F2B84B":"#E9EDF2";
    s+='<polyline points="'+p.pts.map(function(q){return fx(q[0]).toFixed(1)+","+fy(q[1]).toFixed(1)}).join(" ")+'" fill="none" stroke="'+col+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"'+(p.dash?' stroke-dasharray="4 4"':'')+(p.arrow===false?'':' marker-end="url(#a'+(p.s==="d"?"d":"o")+')"')+' opacity=".9"/>'});
  pts.forEach(function(p){var cx=fx(p.x),cy=fy(p.y),t=esc(String(p.t).slice(0,3)),fs=t.length>2?7.4:t.length>1?9:10.5;
    var R=LIN?7:8.4;

      s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="#1E2A22" stroke="#F2B84B" stroke-width="'+(p.hl?3:1.6)+'"/><text x="'+cx+'" y="'+(cy+fs*.36)+'" text-anchor="middle" font-size="'+fs+'" font-weight="700" fill="#F2B84B">'+t+'</text>';

// ================= sheet navigation =================
function show(view,replace){
  if(replace)stack.pop();
  stack.push(view);render();
  var c=$("#card");c.scrollTop=0;
  if(!c.classList.contains("open")){c.classList.add("open");c.setAttribute("aria-hidden","false");$("#home").setAttribute("aria-hidden","true");$("#q").blur()}
  var b=c.querySelector('[data-act="back"]');if(b)b.focus({preventScroll:true});
}
function closeCard(){
  stack.length=0;current=null;
  var c=$("#card");c.classList.remove("open");c.setAttribute("aria-hidden","true");$("#home").removeAttribute("aria-hidden");
  markNav("home");
}
function back(){
  stack.pop();
  if(stack.length){render();$("#card").scrollTop=0;return}
  closeCard();renderList();
}
function goHome(){closeCard();$("#q").value="";renderList();window.scrollTo(0,0)}
function navTo(k){
  if(k==="home"){goHome();return}
  stack.length=0;deepOpen=false;$("#q").value="";renderList();
  if(CATS[k]){browseCat=k;show({t:"browse"})}
  else if(k==="announcers")show({t:"ann"});
  else if(k==="compare")openCompareHome();
  else if(k==="ask")show({t:"ask",q:""});
}
function renderNav(){
  $("#side").innerHTML='<h1>Our Guys</h1>'+NAV.map(function(n,i){return (i===1||i===8||i===9?'<hr>':'')+'<button data-nav="'+n[0]+'" style="--cc:'+n[2]+'"><i aria-hidden="true"></i>'+n[1]+'</button>'}).join("");
  $("#grid").innerHTML=NAV.slice(1).map(function(n){return '<button data-nav="'+n[0]+'" style="--cc:'+n[2]+'"><b>'+n[1]+'</b><small>'+n[3]+'</small></button>'}).join("");
  markNav("home");
}
function markNav(k){[].forEach.call(document.querySelectorAll("#side [data-nav]"),function(b){b.setAttribute("aria-current",b.dataset.nav===k)})}
function navKey(v){return v.t==="browse"?browseCat:v.t==="ref"?(REFMAP[v.id]||{}).cat:(v.t==="ann"||v.t==="annp")?"announcers":(v.t==="compare"||v.t==="pick")?"compare":v.t==="ask"?"ask":"home"}
function cur(){return stack[stack.length-1]}
function waiting(msg){$("#card").innerHTML='<div class="wrap"><header class="phdr"><div class="bar">'+BACK+'</div></header><section class="sec"><div class="working"><span class="spin"></span><span>'+msg+'</span></div></section></div>'}
function need(ids,v){ // make sure retired / career data is loaded for these players before drawing
  if(ids.some(function(id){return !byIdMap[id]})){if(RET){return true}waiting("Loading retired players");loadRetired().then(function(){if(cur()===v)render()},function(){});return false}
  return true;
}
function render(){
  var v=cur();current=null;markNav(navKey(v));
  if(v.t==="player"){if(!need([v.id],v))return;current=byIdMap[v.id];if(!current){back();return}
    if(current.ret)renderRetired(current);else renderPlayer(current);if(WORKER&&!stories[v.id])fetchStory(v.id)}
  else if(v.t==="ann")renderAnnList();
  else if(v.t==="annp")renderAnn(v.id);
  else if(v.t==="ref")renderRef(REFMAP[v.id]);
  else if(v.t==="browse")renderBrowse();
  else if(v.t==="ask")renderAsk(v);
  else if(v.t==="pick")renderPick(v);
  else if(v.t==="compare")renderCompare(v);
}

// ================= player card =================
function statsHTML(pairs,s){return '<dl class="stats">'+pairs.map(function(r){return '<div><dd>'+val(r[0],s)+(r[2]||"")+'</dd><dt>'+r[1]+'</dt></div>'}).join("")+'</dl>'}
function advHTML(pairs,a){return '<dl class="stats">'+pairs.map(function(r){var v=a[r[0]];return '<div><dd>'+(v==null?0:v)+(r[2]||"")+'</dd><dt>'+r[1]+'</dt></div>'}).join("")+'</dl>'}
function storyHTML(p){
  var st=stories[p.id];
  var deep='<a class="btn ghost" href="'+wiki(p)+'" target="_blank" rel="noopener">Read his full bio</a>';
  if(!st){
    if(!WORKER)return '<p class="thin">Stories switch on once the worker is set up.</p>'+deep;
    return '<p class="thin">Nobody has looked him up yet. The first time takes a few seconds, then it is saved for both of you.</p><button class="btn" data-act="story">Get his story</button>';
  }

  h+='<section class="sec"><h3>This season <span>'+(s.gp?s.gp+' games, through Week '+META.week:'through Week '+META.week)+'</span></h3>';

  else h+='<p class="nostat">Nobody keeps stats on '+(p.pos==="OL"?"linemen":"long snappers")+'.'+(s.gp?' He has played in '+s.gp+' game'+(s.gp>1?'s':'')+'.':'')+'</p>';

       '<div class="drawer'+(drawerOpen?' on':'')+'" id="drw">'+advHTML(ADV[kind],s.adv)+'<p class="thru">These run a little behind. Through Week '+s.adv.thru+'.</p></div>';

  if(lay){
    h+='<button class="more" data-act="career" aria-expanded="'+careerOpen+'" aria-controls="car"><span>'+(careerOpen?'Hide career':'Career numbers')+'</span><i aria-hidden="true">&#9662;</i></button>'+
       '<div class="drawer'+(careerOpen?' on':'')+'" id="car">'+careerHTML(p)+'</div>';
  }
  h+='</section>';

  if(s.last){
    var L=s.last,opp=team(L.opp),keys=(lay||[]).map(function(r){return r[0]}).slice(0,4);
    var line=keys.map(function(k){return {k:k,v:val(k,L.line)}}).filter(function(x){return x.v!==0&&x.v!=="0/0"});
    h+='<section class="sec"><h3>Last game</h3><div class="last"><div class="g">Week '+L.wk+' '+(L.home?'vs':'at')+' '+logo(L.opp)+'<b>'+opp.n+(L.res?',</b> '+L.res:'</b>')+'</div>'+
       (line.length?'<div class="line">'+line.map(function(x){return '<span><strong>'+x.v+'</strong>'+(SHORT[x.k]||x.k)+'</span>'}).join("")+'</div>':'<div class="line"><span>Played, nothing on the stat sheet.</span></div>')+'</div></section>';
  }

function renderAsk(v){
  var h='<div class="wrap" style="--ac:#6FA8FF"><header class="phdr"><div class="bar">'+BACK+'</div><h2>Ask</h2></header>';
  h+='<form class="askbox" id="askf"><input id="askq" type="text" placeholder="What’s a trips bunch?" value="'+esc(v.q||"")+'" enterkeyhint="send" autocomplete="off" aria-label="Your question"><button type="submit">Ask</button></form>';
  h+='<div id="askout">';
  if(v.state==="working")h+='<section class="sec"><div class="working"><span class="spin"></span><span id="askmsg">Checking the current rules</span></div></section>';
  else if(v.state==="error")h+='<section class="sec"><p class="thin">Could not get an answer right now ('+esc(v.err)+').</p><button class="btn" data-act="askagain">Try again</button></section>';
  else if(v.ans)h+=answerHTML(v.ans);
  h+='</div>';
  var recent=asks.filter(function(a){return !v.ans||a.key!==v.ans.key}).slice(0,12);
  if(recent.length)h+='<section class="sec"><h3>Asked before</h3><ul class="list">'+recent.map(askRowHTML).join("")+'</ul></section>';
  $("#card").innerHTML=h+'</div>';
  $("#askf").addEventListener("submit",function(ev){ev.preventDefault();var q=$("#askq").value.trim();if(q)doAsk(q)});
}
function doAsk(q){
  var v=cur();if(!v||v.t!=="ask")return;
  v.q=q;v.state="working";v.ans=null;renderAsk(v);$("#askq").blur();
  var t1=setTimeout(function(){var m=$("#askmsg");if(m)m.textContent="Reading what turned up"},5000);
  var t2=setTimeout(function(){var m=$("#askmsg");if(m)m.textContent="Writing it up"},11000);
  api("/ask",{method:"POST",body:JSON.stringify({q:q})}).then(function(a){
    askCache[a.key]=a;save("og_askcache",askCache);
    asks=[{q:a.q,key:a.key,title:a.title,short:a.short,at:a.at}].concat(asks.filter(function(x){return x.key!==a.key})).slice(0,40);save("og_asks",asks);
    if(cur()===v){v.state="done";v.ans=a;renderAsk(v)}
  }).catch(function(e){if(cur()===v){v.state="error";v.err=e.message;renderAsk(v)}})
  .then(function(){clearTimeout(t1);clearTimeout(t2)});
}
function openAsked(key){
  var v={t:"ask",q:"",state:"done",ans:askCache[key]||null};
  show(v);
  if(!v.ans){v.state="working";renderAsk(v);
    api("/ask/"+key).then(function(a){askCache[key]=a;save("og_askcache",askCache);if(cur()===v){v.q=a.q;v.state="done";v.ans=a;renderAsk(v)}})
    .catch(function(e){if(cur()===v){v.state="error";v.err=e.message;renderAsk(v)}});
  }else v.q=v.ans.q;
  if(v.ans)renderAsk(v);
}

// ================= compare =================
function topAtPos(pos,n,skip){
  var h=HEAD[pos];if(!h||pos==="DB")return [];
  return P.filter(function(p){return p.pos===pos&&S[p.id]&&p.id!==skip}).sort(function(a,b){return num(val(h[0],S[b.id]))-num(val(h[0],S[a.id]))}).slice(0,n);
}
function renderPick(v){
  var a=v.keep?byIdMap[v.keep]:null;
  var h='<div class="wrap" style="--ac:#6FA8FF"><header class="phdr"><div class="bar">'+BACK+'</div><h2>'+(a?'Compare '+esc(a.name.split(" ").pop())+' with':'Pick a player')+'</h2></header>';
  h+='<label class="pickin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BA6B5" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg><input id="pickq" type="search" placeholder="Search any player" autocomplete="off" autocorrect="off" spellcheck="false" value="'+esc(v.q||"")+'" aria-label="Search players"></label>';
  h+='<div id="pickres"></div></div>';
  $("#card").innerHTML=h;
  var inp=$("#pickq");inp.addEventListener("input",function(){v.q=inp.value;pickResults(v)});
  pickResults(v);
}
function pickResults(v){
  var a=v.keep?byIdMap[v.keep]:null,q=(v.q||"").trim(),h="";
  if(q){var r=searchPlayers(q).filter(function(p){return p.id!==v.keep}).slice(0,25);
    h='<section class="sec" style="padding-top:14px"><ul class="rows">'+(r.length?r.map(function(p){return rowHTML(p,true)}).join(""):'<li class="empty">No active player by that name.</li>')+'</ul>'+retBlock(q).replace('margin-top:20px','margin-top:16px')+'</section>';
  }else{
    var f=favs.map(function(id){return byIdMap[id]}).filter(function(p){return p&&p.id!==v.keep});

    api("/favs").then(function(list){favs=list;save("og_favs",favs);if(!stack.length)renderList();favsNeedRetired()}).catch(function(){$("#lc").textContent="Shared list unreachable"});
    api("/asks").then(function(list){asks=list;save("og_asks",asks)}).catch(function(){});
  }
})
.catch(function(){$("#results").innerHTML='<ul class="rows"><li class="empty"><strong>Could not load player data.</strong>Check the connection and pull down to refresh.</li></ul>';$("#upd").textContent=""});
</script>
